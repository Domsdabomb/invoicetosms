{% extends "base.html" %}
{% block title %}Setup - The Crucible{% endblock %}

{% block content %}
<div class="auth-page">
    <h1>The Crucible</h1>
    <p class="auth-subtitle">Create your admin account to get started.</p>

    <div class="card auth-card">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label>Username</label>
            <input type="text" name="username" required class="input" autofocus>
            <label>Password (6+ characters)</label>
            <input type="password" name="password" required minlength="6" class="input">
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1.25rem;">Create Account</button>
        </form>
    </div>
</div>
{% endblock %}
